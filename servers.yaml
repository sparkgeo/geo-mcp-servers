# Geospatial MCP Servers — source of truth
#
# This file is the ONLY place to edit server entries. The README.md tables are
# generated from it by `python scripts/generate_readme.py`.
#
# Each entry:
#   name:        (required) display name
#   url:         (required) canonical source URL (prefer the GitHub repo)
#   description: (required) one line, what it does
#   category:    (required) one of the keys in `categories` below
#   author:      (optional) person or org
#   language:    (optional) Python | TypeScript | Go | Rust | ...
#   official:    (optional, bool) true if vendor/official, false/omitted if community
#   tags:        (optional) list of freeform keywords
#   added:       (optional) YYYY-MM-DD you added it
#   note:        (optional) caveats, e.g. URL needs confirming
#
# `official: true` is the strongest trust signal this catalog emits, so CI makes
# you back it up rather than just assert it:
#   vendor_orgs:   (required when official + GitHub URL) list of GitHub org logins
#                  the vendor controls. CI checks the repo owner is one of them,
#                  which is what stops a lookalike org inheriting the badge.
#   vendor_domain: (required when official + non-GitHub URL, and for any hosted
#                  entry) registrable domain the vendor controls, e.g. carto.com.
#                  The URL host must equal it or be a subdomain of it.
#   transport:     (optional) stdio | http | hosted | addin | unknown. `hosted`
#                  means there is no source to scan, so CI can only check the
#                  endpoint is still live.
#
# The shape above is enforced by servers.schema.json in .github/workflows/verify.yml.
#
# To add a server: append an entry under `servers:` and run the generator.

categories:
  geocoding:        "Geocoding & place search"
  routing:          "Routing, isochrones & navigation"
  mapping:          "Maps, tiles & commercial platforms"
  database:         "Spatial databases & analytics"
  remote_sensing:   "Remote sensing, STAC & earth observation"
  weather:          "Weather & climate"
  desktop_gis:      "Desktop & enterprise GIS (QGIS, ArcGIS)"
  toolkit:          "General GIS / geoprocessing toolkits"
  data_access:      "Geospatial data access & catalogs"
  tracking:         "Aviation & maritime tracking (ADS-B, AIS)"
  other:            "Other (IP geolocation, misc)"

