name: README check

# Fails a PR (or push to main) when README.md is out of sync with servers.yaml —
# i.e. someone edited the catalog but didn't regenerate the tables. Uses the
# committed health.json as-is; it does NOT run the network health check (that
# needs the gh CLI), so this stays fast and offline.

on:
  pull_request:
    paths:
      - servers.yaml
      - health.json
      - README.md
      - scripts/generate_readme.py
  push:
    branches: [main]
    paths:
      - servers.yaml
      - health.json
      - README.md
      - scripts/generate_readme.py

permissions:
  contents: read

concurrency:
  group: readme-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-readme:
    name: Verify README matches servers.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify README matches servers.yaml
        run: |
          python scripts/generate_readme.py --check \
            || { echo "::error::README.md is stale. Run: python scripts/generate_readme.py"; exit 1; }
